[project]
name = "varsha"
version = "0.1.0"
description = "Vulnerability-Aware Regional Severe-weather Hazard Anticipation System (VARSHA) - AI-based severe weather early warning system for India."
authors = [{name = "SIH Team", email = "team@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "pytorch-lightning>=2.0",
    "xarray",
    "netCDF4",
    "h5py",
    "rasterio",
    "rioxarray",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
    "matplotlib",
    "cartopy",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "pyyaml",
    "tqdm",
    "requests",
    "aiohttp",
    "captum",
    "whiteboxtools"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
